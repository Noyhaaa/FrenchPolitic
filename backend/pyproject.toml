[project]
name = "decrypte-backend"
version = "0.1.0"
description = "API de Décrypté — compréhension neutre des votes de l'Assemblée nationale"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # Base ingérée (REPOSITORY_BACKEND=postgres) — sans elles, l'API démarre
    # mais tombe dès qu'elle sert autre chose que le seed.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Extraction du texte des PDF officiels (exposé des motifs, dispositif).
    "pypdf>=5.1",
    # Comptes utilisateurs : hachage du mot de passe et jeton de session.
    # Deux dépendances, pas une pile d'authentification — l'API n'a qu'un seul
    # secret et quatre routes de compte (cf. app/security.py).
    "bcrypt>=4.1",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
